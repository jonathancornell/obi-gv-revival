name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: No firmware binaries or backups committed
        run: |
          if git ls-files | grep -E '\.(fw|bsdiff)$|backup.*\.xml$'; then echo "forbidden file committed"; exit 1; fi
